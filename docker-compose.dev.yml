version: '3'
services:
  app:
    container_name: app-visium-api
    depends_on:
      - db
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:13-alpine
    container_name: db
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_DB=visium
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - 5432:5432

networks: 
  default:
    name: app-visium-network

volumes:
  db-data-dev: